id: GE-CON-002                      # <BG|GE|NBG>-<AREA>-<NNN>; AREA: CON ACC TRX PIS PST PCN SBK AUTH SIG TLS ERR HDR GEN
title: "Replace 9999-12-31 with the maximum consent term"
status: approved                    # draft | approved | rejected | retired | invalid (failed the automatic checks)
level: MUST                         # MUST | SHOULD | MAY — must be backed by the quote's wording
service: AIS                        # AIS | PIS | COMMON
area: CON
source:
  standard: GE-XS2A
  version: "0.8.RC3"
  clause: "9.1.1.10"
  quote: "გამონაკლისს შეადგენს მნიშვნელობა „9999-12-31“, რომლის მიღების შემთხვევაში აუცილებელია ამსმპ-მა თანხმობის ვადა შეცვალოს მაქსიმალურ დასაშვებ მნიშვნელობაზე (არაუმეტეს 90 დღისა)"
  quoteEnglish: "The exception is the value '9999-12-31': on receiving it, the ASPSP must change the consent term to the maximum allowed value (not more than 90 days)"  # AI translation
requirement: "When validUntil is 9999-12-31, the ASPSP sets the consent's validity to the maximum allowed (at most 90 days) and returns that date in the consent details."
appliesTo:
  operation: "POST /v2/consents/account-access"
check:
  kind: positive                    # negative | positive | header | signature | flow | manual
  description: "Create a consent with validUntil 9999-12-31, then GET the consent and expect validUntil within 90 days."
  expectStatus: [201]
