id: NEG-CON-004
title: Create consent with frequencyPerDay above the limit is rejected
suite: negative
severity: Major
specRef: "NextGenPSD2 IG (ENG) 6.3.1 Account Information Consent Request; 14.11.1 (p. 127, 133, 140, 143-145, 148, 149, 274)"
origin: TPP/Blazor/BadRequests/CreateConsentBadRequests.cs#InvalidFrequencyPerDay

steps:
  - name: POST consent with frequencyPerDay = 7
    request:
      method: POST
      path: v2/consents/account-access
      headersTemplate: consent
      bodyTemplate: consent.aspspManaged
      body:
        frequencyPerDay: 7
        validTo: "{{date.today+5d}}"
    expect:
      status: 400
      errorCode: FORMAT_ERROR
      echoRequestId: true
