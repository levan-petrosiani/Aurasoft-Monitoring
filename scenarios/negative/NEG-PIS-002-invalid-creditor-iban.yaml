id: NEG-PIS-002
title: Payment with an invalid creditor IBAN is rejected
suite: negative
severity: Major
specRef: "GE-XS2A 0.8.RC3 — 8.2.1: formats (e.g. IBAN) are checked at initiation; failure is FORMAT_ERROR"
requires: [features.payments=domestic, variables.pis.creditorIban]

steps:
  - name: POST domestic payment with a wrong IBAN check digit
    request:
      method: POST
      path: v1/payments/domestic
      headersTemplate: payment
      bodyTemplate: payment.domestic
      body: { creditorAccount: { iban: GE00NB0000000000009999 } }
    expect:
      status: 400
      errorCode: FORMAT_ERROR
      echoRequestId: true
