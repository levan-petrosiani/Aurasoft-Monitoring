id: NEG-PIS-003
title: Payment without instructedAmount is rejected
suite: negative
severity: Major
specRef: "GE-XS2A 0.8.RC3 — 8.2.1 table 4: instructedAmount is mandatory (m); a missing mandatory field is FORMAT_ERROR"
requires: [features.payments=domestic, variables.pis.creditorIban]

steps:
  - name: POST domestic payment without instructedAmount
    request:
      method: POST
      path: v1/payments/domestic
      headersTemplate: payment
      bodyTemplate: payment.domestic
      bodyRemove: [instructedAmount]
    expect:
      status: 400
      errorCode: FORMAT_ERROR
      echoRequestId: true
