id: NEG-CON-002
title: Create consent with an invalid PSU-IP-Address is rejected
suite: negative
severity: Major
specRef: "NextGenPSD2 IG (ENG) 6.3.1 Account Information Consent Request; 14.11.1 (p. 130, 140, 142, 144-146, 274)"
origin: TPP/Blazor/BadRequests/CreateConsentBadRequests.cs#InvalidPsuIpAddressHeader

steps:
  - name: POST consent with PSU-IP-Address = InvalidIpAddress
    request:
      method: POST
      path: v2/consents/account-access
      headersTemplate: consent
      headers:
        PSU-IP-Address: InvalidIpAddress
      bodyTemplate: consent.accountList
    expect:
      status: 400
      errorCode: FORMAT_ERROR
      echoRequestId: true
