# Reusable header sets and request bodies.
# Ported from the TestTool templates (TPP/Blazor/Templates/ConsentTemplates.cs), in the
# Georgian XS2A v2 format (consentType / validTo), not Berlin Group 1.3.

headers:
  # ConsentTemplates.GetBasicRequestHeaders2
  basic:
    X-Request-ID: "{{uuid}}"
    PSU-IP-Address: 192.168.1.1
    PSU-User-Agent: ApiTestTool
    PSU-Device-ID: "{{uuid}}"
    PSU-Geo-Location: "GEO:52.506931;13.144558"
    PSU-Accept-Language: ka

  # ConsentTemplates.GetDefaultConsentRequestHeader / GetConsentAuthorizationRequestHeader.
  # The SDK property is called TppRedirectUri, but the header it sends is Client-Redirect-URI
  # (PredefinedHeaderNames.ClientRedirectUri); it is also part of the JWS signature (sigD.pars).
  # XS2A requires the same value on consent creation and on start authorisation.
  consent:
    X-Request-ID: "{{uuid}}"
    PSU-IP-Address: 192.168.1.1
    Client-Redirect-URI: "{{tpp.redirectUri}}"
    PSU-User-Agent: ApiTestTool
    PSU-Device-ID: "{{uuid}}"
    PSU-Geo-Location: "GEO:52.506931;13.144558"
    PSU-Accept-Language: ka

bodies:
  # ConsentTemplates.GetConsentRequestBodyAccountList (defaults from ConsentRequestBasicElements)
  consent.accountList:
    access:
      payments:
        - rights: [accountDetails]
    consentType: accountList
    recurringIndicator: true
    validTo: "{{date.today+2d}}"
    frequencyPerDay: 4

  # ConsentTemplates.GetConsentRequestBodyAccountList(withBalance: true)
  consent.accountListWithBalances:
    access:
      payments:
        - rights: [accountDetails, balances]
    consentType: accountList
    recurringIndicator: true
    validTo: "{{date.today+2d}}"
    frequencyPerDay: 4

  # ConsentTemplates.GetConsentRequestBodyWithAspspManaged
  consent.aspspManaged:
    access:
      payments:
        - rights: [balances, transactions]
    consentType: aspspManaged
    recurringIndicator: true
    validTo: "{{date.today+2d}}"
    frequencyPerDay: 4
