id: PRE-003
title: Auth server publishes a complete OAuth2/OIDC discovery document
suite: preflight
severity: Major
specRef: "RFC 8414 / OpenID Connect Discovery 1.0; NBG XS2A OAuth SCA approach"
origin: TPP/Blazor/Processes/Psd2ProcessBase.cs#ValidateGetOAuthUrl
requires:
  - endpoints.discovery

steps:
  - name: GET discovery document
    request:
      method: GET
      target: discovery
      path: ""
      signing: none
    expect:
      status: 200
      contentType: application/json
      responseSignature: ignore
      exists:
        - $.issuer
        - $.authorization_endpoint
        - $.token_endpoint
      # The TestTool reports these as warnings, so do we.
      warnIfMissing:
        - $.registration_endpoint
        - $.scopes_supported
        - $.response_types_supported
        - $.grant_types_supported
        - $.token_endpoint_auth_methods_supported
        - $.ui_locales_supported
        - $.code_challenge_methods_supported
        - $.mtls_endpoint_aliases
        - $.tls_client_certificate_bound_access_tokens
