# Standards the rules are drafted from. The files themselves are not committed (licences differ, and they are
# large): `aqt standards fetch` downloads them to standards/sources/<file> and checks the SHA-256 below, and
# `aqt standards ingest` splits them into clauses and stores them in PostgreSQL.
#
# A new version = a new entry (keep the old one while rules still reference it).

- id: BG-IG
  title: NextGenPSD2 XS2A Framework – Implementation Guidelines
  publisher: Berlin Group
  version: "1.3.16"
  published: 2025-11-27
  language: en
  format: pdf
  url: https://badopkt.myrdbx.io/wp-content/uploads/2026/09/Berlin-Group-NextGenPSD2-Implementation-Guidelines-1.3.16-2025-12-02.pdf
  page: https://berlin-group.org/library/?standard=Open%20Banking%20/%20NextGenPSD2
  file: bg-ig/1.3.16/implementation-guidelines.pdf
  sha256: f0030d92f3fce42d46900c76e762a58a8982a8f15ed4220980a58e41b2243756
  license: Creative Commons Attribution-NoDerivatives 4.0 (Berlin Group)
  # Running header and footer lines on every page (regexes); dropped wherever the PDF reader puts them.
  pageFurniture:
    - "^NextGenPSD2 XS2A Framework – Implementation Guidelines"
    - "^Published by the Berlin Group under Creative Commons"
    - "^\\(ref\\. License Notice for full license conditions\\)"
  # The PDF has a stray sentence ("The payment data contained ... JSON or XML.") glued into the chapter 6 heading.
  titles:
    "6": Account Information Service

