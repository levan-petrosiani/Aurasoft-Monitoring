# Local AltaSoft XS2A (developer machine), same URL the TestTool uses for "Localhost".

extends: _shared.yaml

bank:
  bic: ALTAGE22
  name: AltaSoft local XS2A

endpoints:
  xs2a: https://localhost:10001/

tpp:
  validateServerCertificate: false   # localhost development certificate

# The local AltaSoft stack supports the AIS flow with the OAuth SCA approach.
# Its AuthServer is reached through the consent's _links.scaOAuth, so no discovery URL is needed here.
features:
  consents: [accountList, aspspManaged, detailed]
  accounts: [current]
  scaOAuth: true
