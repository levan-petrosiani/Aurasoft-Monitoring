# ApiTestTool.MockBank on this machine — for trying the tool without any bank credentials.
# Start the MockBank project first, then:  aqt run --bank MOCK --sca-auto
#
# No certificate files are needed: the TPP QWAC/QSealC are generated for each run (selfSigned),
# and MockBank generates its own server certificate, so server validation is off.

bank:
  bic: MOCKGE22
  name: ApiTestTool MockBank (local)
  spec: NBG XS2A v2 (mock)

endpoints:
  xs2a: https://localhost:7443/
  discovery: https://localhost:7443/.well-known/oauth-authorization-server

tpp:
  qwac:
    selfSigned: { organizationId: PSDGE-NBG-MOCKTPP, commonName: ApiTestTool Mock TPP QWAC }
  qsealc:
    selfSigned: { organizationId: PSDGE-NBG-MOCKTPP, commonName: ApiTestTool Mock TPP QSealC }
  redirectUri: http://localhost:5199/callback
  validateServerCertificate: false

features:
  consents: [accountList, aspspManaged]
  scaOAuth: true
  accounts: [current]
  payments: [aspsp, domestic, foreign]   # payment products for /v1/payments/{product} (GE-XS2A 8.1)
  piis: false

variables:
  psu1:
    username: testuser1
  accounts:
    gel: GE63MK0000000000000001
    usd: GE36MK0000000000000002
  # Payment initiation test accounts. PIS scenarios run only when these are set: a real bank's profile must use the
  # bank's sandbox test accounts here, never real ones.
  pis:
    debtorIban: GE63MK0000000000000001        # MockBank's GEL account
    creditorIban: GE24NB0000000000009999      # an account at another bank (RTGS)
    creditorName: Test Creditor
    creditorAgent: NBGEGE22
    aspspCreditorIban: GE09MK0000000000000003 # another account at the same bank
    foreignDebtorIban: GE36MK0000000000000002 # MockBank's USD account
    foreignCreditorIban: DE89370400440532013000
    foreignCreditorName: Test Creditor GmbH
    foreignCreditorAgent: COBADEFFXXX

limits:
  timeoutSeconds: 15
  delayBetweenRequestsMs: 0
  slowResponseMs: 3000

# MockBank signs every response, so a missing or broken signature is a real defect here.
responseSignature: required
