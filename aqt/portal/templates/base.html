<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}API Test Portal{% endblock %} · API Test Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">
        <img class="brand-logo" src="{{ url_for('static', filename='aura-logo.png') }}" alt="Aura Monitoring" />
    </a>
    <nav>
        <a href="/" class="{{ 'active' if page == 'home' }}">Dashboard</a>
        <a href="/run/new" class="{{ 'active' if page == 'new' }}">New run</a>
        <a href="/runs" class="{{ 'active' if page == 'runs' }}">Runs</a>
        <a href="/compare" class="{{ 'active' if page == 'compare' }}">Compare</a>
        <a href="/scenarios" class="{{ 'active' if page == 'scenarios' }}">Scenarios</a>
        <a href="/standards" class="{{ 'active' if page == 'standards' }}">Standards</a>
        <a href="/rules" class="{{ 'active' if page == 'rules' }}">Rules</a>
        <a href="/drafts" class="{{ 'active' if page == 'drafts' }}">Drafts</a>
        <a href="/coverage" class="{{ 'active' if page == 'coverage' }}">Coverage</a>
        <a href="/ask" class="{{ 'active' if page == 'ask' }}">Ask</a>
        <a href="/monitoring" class="{{ 'active' if page == 'monitoring' }}">Monitoring</a>
        <a href="/alerts" class="{{ 'active' if page == 'alerts' }}">Alerts</a>
    </nav>
</header>

<main class="page" id="page">
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
