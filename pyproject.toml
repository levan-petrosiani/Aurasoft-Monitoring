[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apitesttool"
version = "0.1.0"
description = "Tests a bank's XS2A sandbox and auth server the way a TPP would (Python edition of ApiTestTool)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "cryptography>=42",
    "pyOpenSSL>=24.3",
    "Flask>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Store (PostgreSQL), standards (PDF) and AI (Claude, local models via Ollama). The core tool does not need them.
ai = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "anthropic>=2.3",
    "pdfplumber>=0.11",
]

[project.scripts]
aqt = "aqt.cli:_entry"

[tool.setuptools.packages.find]
include = ["aqt*"]

[tool.setuptools.package-data]
aqt = ["mockbank/*.json", "portal/templates/*.html", "portal/static/*.css", "portal/static/*.png",
       "store/migrations/*.sql", "ai/prompts/*.txt", "ai/prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
