[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apitesttool"
version = "0.1.0"
description = "Tests a bank's XS2A sandbox and auth server the way a TPP would (Python edition of ApiTestTool)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "cryptography>=42",
    "pyOpenSSL>=24.3",
    "Flask>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
aqt = "aqt.cli:_entry"

[tool.setuptools.packages.find]
include = ["aqt*"]

[tool.setuptools.package-data]
aqt = ["mockbank/*.json", "portal/templates/*.html", "portal/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
